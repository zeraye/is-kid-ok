<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waga</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 24px 16px;
            max-width: 480px;
            margin: 0 auto;
        }
        label {
            display: block;
            margin-top: 16px;
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }
        input {
            width: 100%;
            padding: 14px;
            font-size: 20px;
            border: 2px solid #ccc;
            border-radius: 8px;
            margin-top: 6px;
            -webkit-appearance: none;
        }
        input:focus {
            outline: none;
            border-color: #0066cc;
        }
        #result {
            margin-top: 24px;
            font-size: 22px;
            font-weight: bold;
            min-height: 1.5em;
            color: #16a34a;
        }
        .clear-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 16px;
            padding: 10px 18px;
            min-height: 44px;
            font-size: 16px;
            font-weight: 500;
            color: #555;
            background: #f2f2f2;
            border: 1px solid #ccc;
            border-radius: 8px;
            cursor: pointer;
            -webkit-appearance: none;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
        }
        .clear-btn:hover {
            background: #e4e4e4;
            color: #111;
            border-color: #bbb;
        }
        .clear-btn:active {
            background: #d8d8d8;
        }
    </style>
</head>
<body>
    <label for="startWeight">Waga startowa</label>
    <input type="text" id="startWeight" inputmode="decimal" placeholder="np. 3500" autofocus>

    <label for="currentWeight">Waga obecna</label>
    <input type="text" id="currentWeight" inputmode="decimal" placeholder="np. 3250">

    <div id="result">Waga zmalała o 0.00%</div>

    <button type="button" id="clearBtn" class="clear-btn" aria-label="Wyczyść oba pola">✕ Wyczyść</button>

    <script>
        const startInput = document.getElementById('startWeight');
        const currentInput = document.getElementById('currentWeight');
        const clearBtn = document.getElementById('clearBtn');
        const resultElement = document.getElementById('result');

        function calculate() {
            const startVal = startInput.value.trim();
            const currentVal = currentInput.value.trim();

            if (!startVal || !currentVal) {
                resultElement.innerText = 'Waga zmalała o 0.00%';
                resultElement.style.color = '#16a34a';
                return;
            }

            const start = parseFloat(startVal.replace(',', '.'));
            const current = parseFloat(currentVal.replace(',', '.'));

            if (isNaN(start) || isNaN(current)) {
                resultElement.innerText = 'Wprowadź poprawne liczby.';
                resultElement.style.color = '#dc2626';
                return;
            }

            if (start <= 0) {
                resultElement.innerText = 'Waga startowa musi być większa od 0.';
                resultElement.style.color = '#dc2626';
                return;
            }

            const diffPercent = ((start - current) / start) * 100;

            if (diffPercent >= 0) {
                resultElement.innerText = `Waga zmalała o ${diffPercent.toFixed(2)}%`;
            } else {
                resultElement.innerText = `Waga wzrosła o ${Math.abs(diffPercent).toFixed(2)}%`;
            }

            if (diffPercent <= 10) {
                resultElement.style.color = '#16a34a';
            } else {
                resultElement.style.color = '#dc2626';
            }
        }

        clearBtn.addEventListener('click', () => {
            startInput.value = '';
            currentInput.value = '';
            calculate();
            startInput.focus();
        });

        startInput.addEventListener('input', calculate);
        currentInput.addEventListener('input', calculate);

        calculate();
    </script>
</body>
</html>
