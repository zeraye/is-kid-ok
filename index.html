<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waga</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 24px 16px;
            max-width: 480px;
            margin: 0 auto;
        }
        label {
            display: block;
            margin-top: 16px;
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }
        .input-wrapper {
            position: relative;
            margin-top: 6px;
        }
        .input-wrapper input {
            width: 100%;
            padding: 14px;
            padding-right: 44px;
            font-size: 20px;
            border: 2px solid #ccc;
            border-radius: 8px;
            -webkit-appearance: none;
        }
        .input-wrapper input:focus {
            outline: none;
            border-color: #0066cc;
        }
        .clear-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 28px;
            height: 28px;
            border: none;
            background: #e0e0e0;
            color: #666;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            line-height: 1;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 0;
            user-select: none;
            transition: background 0.15s, color 0.15s;
        }
        .clear-btn:hover {
            background: #ccc;
            color: #222;
        }
        .clear-btn.visible {
            display: flex;
        }
        #result {
            margin-top: 24px;
            font-size: 22px;
            font-weight: bold;
            min-height: 1.5em;
        }
    </style>
</head>
<body>
    <label for="startWeight">Waga startowa</label>
    <div class="input-wrapper">
        <input type="text" id="startWeight" inputmode="decimal" placeholder="np. 3500" autofocus>
        <button type="button" class="clear-btn" id="clearStart" aria-label="Wyczyść wagę startową">&times;</button>
    </div>

    <label for="currentWeight">Waga obecna</label>
    <div class="input-wrapper">
        <input type="text" id="currentWeight" inputmode="decimal" placeholder="np. 3250">
        <button type="button" class="clear-btn" id="clearCurrent" aria-label="Wyczyść wagę obecną">&times;</button>
    </div>

    <div id="result">Waga zmalała o 0.00%</div>

    <script>
        const startInput = document.getElementById('startWeight');
        const currentInput = document.getElementById('currentWeight');
        const clearStartBtn = document.getElementById('clearStart');
        const clearCurrentBtn = document.getElementById('clearCurrent');
        const resultElement = document.getElementById('result');

        function updateClearBtn(input, btn) {
            if (input.value.length > 0) {
                btn.classList.add('visible');
            } else {
                btn.classList.remove('visible');
            }
        }

        function setupClearButton(input, btn) {
            btn.addEventListener('pointerdown', (e) => {
                e.preventDefault();
            });
            btn.addEventListener('click', () => {
                input.value = '';
                updateClearBtn(input, btn);
                calculate();
                input.focus();
            });
        }

        setupClearButton(startInput, clearStartBtn);
        setupClearButton(currentInput, clearCurrentBtn);

        function calculate() {
            const startVal = startInput.value.trim();
            const currentVal = currentInput.value.trim();

            if (!startVal || !currentVal) {
                resultElement.innerText = 'Waga zmalała o 0.00%';
                return;
            }

            const start = parseFloat(startVal.replace(',', '.'));
            const current = parseFloat(currentVal.replace(',', '.'));

            if (isNaN(start) || isNaN(current)) {
                resultElement.innerText = 'Wprowadź poprawne liczby.';
                return;
            }

            if (start <= 0) {
                resultElement.innerText = 'Waga startowa musi być większa od 0.';
                return;
            }

            const diffPercent = ((start - current) / start) * 100;

            if (diffPercent >= 0) {
                resultElement.innerText = `Waga zmalała o ${diffPercent.toFixed(2)}%`;
            } else {
                resultElement.innerText = `Waga wzrosła o ${Math.abs(diffPercent).toFixed(2)}%`;
            }
        }

        startInput.addEventListener('input', () => {
            updateClearBtn(startInput, clearStartBtn);
            calculate();
        });

        currentInput.addEventListener('input', () => {
            updateClearBtn(currentInput, clearCurrentBtn);
            calculate();
        });

        updateClearBtn(startInput, clearStartBtn);
        updateClearBtn(currentInput, clearCurrentBtn);
        calculate();
    </script>
</body>
</html>
